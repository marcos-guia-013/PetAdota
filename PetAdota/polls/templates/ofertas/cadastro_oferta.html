
{% extends "base.html" %}

{% block title %}Cadastrar oferta{% endblock %}

{% block content %}

<h1>Cadastrar oferta de doação</h1>

<a href="{% url 'polls:cadastrar_usuario' %}">Cadastrar doador</a>
<a href="{% url 'polls:cadastro_animal' %}">Cadastrar animal</a>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Cadastrar oferta</button>
</form>

<a href="{% url 'polls:listar_ofertas' %}">
    Voltar para as ofertas
</a>

{% endblock %}
